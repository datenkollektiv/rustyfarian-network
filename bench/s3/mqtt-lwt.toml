# Shared-app MQTT smoke with a router block: both tiers run examples-shared/lwt_app.rs, so the steps are shared.
# Needs `.env` (WIFI_*, MQTT_HOST as an IPv4) pointing at a running broker (`just doctor` checks it).
# Log prefix is `[app]`.
examples = ["hal_esp32s3_mqtt_lwt", "idf_esp32s3_mqtt_lwt"]

[[step]]
say = "Check the signal of the joined AP (warns below -75 dBm)"
# The association line names the AP on both tiers: `[wifi] link up #1 — bssid …, ch N, rssi -NN dBm`.
# It passes unless that RSSI is below -75 dBm, a far mesh node.
expect = 'link up #1(?! .*rssi -(7[6-9]|[89]\d) dBm)'
reject = 'rssi -(7[6-9]|[89]\d) dBm'
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
optional = true
arm = false       # printed during the reset, before the step

[[step]]
say = "Wait for the first broker session (unblock the device on the router first if a previous run left it blocked)"
expect = ['Wi-Fi connected \W+ IP: ', '\[app\] connect #1 ']
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
arm = false       # Wi-Fi and the first CONNACK arrive during the reset

[[step]]
say = "Wait for two ticks (one every 5 s)"
arm = false
expect = ['\] tick #\d+ queued', '\] tick #\d+ queued']
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('   # ESP-ROM / rst: is a reboot
timeout = 20

[[step]]
say = "The broker holds the retained status `online`"
probe = ["just", "mqtt-status", "{example}"]
arm = false
expect = '^online$'
serial_reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 10

[[step]]
say = "Live ticks reach the broker"
probe = ["just", "mqtt-watch", "{example}"]
arm = false
expect = ['/tick retain=0 ', '/tick retain=0 ']
serial_reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 15

[[step]]
say = "Once the device is online, please block it on the router, now (MAC as detected)"
arm = false
attended = true   # a person acts on the router
expect = ['\[wifi\] disconnected', '\] tick #\d+ would block \(mqtt Disconnected\)']
reject = 'PANIC|panicked|Guru Meditation|abort\(\)'   # no ESP-ROM/rst: --attended skips the boot step, so this step reads the reset banner
timeout = 150

[[step]]
say = "Please unblock the device, now"
arm = false
attended = true
expect = ['\] tick #\d+ queued', '\] tick #\d+ queued']   # every 5 s while online
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 240
