# Shared-app MQTT scenarios on the CrowPanel S3, both tiers (runbook S3-H1 T5b, S3-B1 R1, and the
# startup-message half of S3-B2); the suspend demo (R3, `wait_suspended`) is the `suspend` check.
# Both examples run examples-shared/lwt_app.rs, so one set of steps judges both tiers (log prefix `[app]`).
# Steps follow docs/runbooks/esp-hal-mqtt-hardware-test.md (T1, T4, T5b) and
# docs/runbooks/wifi-reconnect-hardware-test.md (R1); serial lines and broker messages are judged here.
# Uses `setup`, `run`, `probe` and `serial_reject` (rustyfarian-bench v0.5.0 or later).
# Probe output comes from `just mqtt-watch {example}` (`retain=1` is the replay at subscribe, `retain=0` a live
# message) and `just mqtt-status {example}` (the retained status).
# No step waits for Enter: each watches from the end of the previous step, so an action may come at any time.
# Still a person: the router pause. T5a (AP off) is not run: on a mesh the board roams to another node of
# the same SSID, and the per-device pause covers the same link-loss path (as on the C6).
# The broker is the local one from `just mosquitto` (T4 restarts it), so MQTT_HOST must be this machine's
# LAN IPv4 (or a LAN hostname for the hal DNS line of S3-B2) that the board can reach, at build time and for
# the recipes; a shell variable wins over the dotenv file:
#   MQTT_HOST=<this machine> MQTT_PORT=1883 just bench s3 mqtt-scenarios --port <s3 port>
# Build WITHOUT MQTT_SUSPEND_DEMO: the demo's own disconnects would be judged as outages here.
examples = ["hal_esp32s3_mqtt_lwt", "idf_esp32s3_mqtt_lwt"]
# `just mqtt-pub` exits non-zero when MQTT_HOST is unreachable.
setup = [["just", "mosquitto", "up"], ["just", "mqtt-pub", "bench-ping", "1"]]
# A failed T4 must not leave the broker stopped.
teardown = [["just", "mosquitto", "up"]]

# ── T1: connect, startup message retained, live ticks ───────────────────────

[[step]]
say = "Check the signal of the joined AP (warns below -75 dBm)"
# The association line names the AP on both tiers: `[wifi] link up #1 — bssid …, ch N, rssi -NN dBm`.
# It passes unless that RSSI is below -75 dBm, a far mesh node.
expect = 'link up #1(?! .*rssi -(7[6-9]|[89]\d) dBm)'
reject = 'rssi -(7[6-9]|[89]\d) dBm'
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
optional = true
arm = false       # printed during the reset, before the step

[[step]]
say = "T1: first broker session and two queued ticks"
expect = ['Wi-Fi connected \W+ IP: ', '\[mqtt\] connected \(session present: no, 1 subscriptions\)', '\[app\] connect #1 free heap: \d+ B', '\[app\] tick #\d+ queued', '\[app\] tick #\d+ queued']
reject = 'PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 150
arm = false       # Wi-Fi and the first CONNACK arrive during the reset

[[step]]
say = "T1: the startup message `online` is retained at the broker and live ticks arrive (S3-B2, first connect)"
# The retained status is replayed at subscribe (`retain=1`), then the ticks arrive live (`retain=0`).
probe = ["just", "mqtt-watch", "{example}"]
arm = false
expect = ['/status retain=1 online', '/tick retain=0 \{"tick":\d+', '/tick retain=0 \{"tick":\d+']
reject = '/status retain=0 offline'
serial_reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 15

# ── T4: broker restart, reconnect and startup message again ─────────────────

[[step]]
say = "T4: restart the broker; the firmware reports the loss and reconnects on its own"
# hal resets at once (`session error`) and retries after 10 s; IDF reconnects at esp-mqtt's next retry.
run = ["just", "mosquitto", "restart"]
arm = false
expect = ['\[mqtt\] disconnected', '\[mqtt\] connected \(session present: no, 1 subscriptions\)', '\[app\] connect #2 free heap: \d+ B', '\[app\] tick #\d+ queued']
reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 60

[[step]]
say = "T4: the startup message `online` is retained again after the broker restart (S3-B2)"
probe = ["just", "mqtt-status", "{example}"]
arm = false
expect = '^online$'
serial_reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 10

# ── T5b / R1: per-device pause on the router for 3 minutes ──────────────────

[[step]]
say = "T5b/R1: wait until the board is online (the attended run skips T1 and reads the reset banner here)"
attended = true   # the precondition for the pause: without a broker session there is no will
arm = false
expect = '\[app\] tick #\d+ queued'
reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 150

[[step]]
say = "T5b/R1: Pause the board on the router (MAC {mac}) and keep it paused"
attended = true   # a person acts on the router
arm = false       # watch from the end of the previous step: the action may come at any time
# The link loss ends the session (hal: `network lost`; IDF: the transport's one `[mqtt] error` is expected),
# then every tick reports `would block`; a tick `queued` before the `[mqtt] disconnected` line is allowed.
expect = ['\[wifi\] disconnected', '\[mqtt\] disconnected', '\[app\] mqtt state Connected -> Disconnected', '\[app\] tick #\d+ would block \(mqtt Disconnected\)']
reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 150

[[step]]
say = "T5b/R1: the broker publishes the will (a half-open router path may delay it; a miss is a warning)"
attended = true
probe = ["just", "mqtt-watch", "{example}"]
arm = false
expect = '/status retain=[01] offline'
serial_reject = '\[app\] tick #\d+ (queued|failed)|\[mqtt\] connected|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 90
optional = true

[[step]]
say = "T5b/R1: keep the board paused for another 90 s"
arm = false
attended = true
duration = 90     # with the will step, the pause lasts about 3 minutes
# While down: no tick is queued, none fails, MQTT never connects, no esp-mqtt transport retry (IDF gates the
# session on the link) and the Wi-Fi back-off never exceeds 30000 ms.
reject = '\[app\] tick #\d+ (queued|failed)|\[mqtt\] connected|Error transport connect|\[wifi\] reconnecting in (?!30000 )([3-9]\d{4}|\d{6,}) ms|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('

[[step]]
say = "T5b/R1: Unpause the board on the router; it reconnects without a reboot"
attended = true
arm = false
# The next back-off attempt comes at most 30 s after the unpause; MQTT follows the link-up line within 15 s
# on hal and at esp-mqtt's next retry on IDF.
expect = ['\[wifi\] link up #[2-9]', '\[mqtt\] connected \(session present: no, 1 subscriptions\)', '\[app\] connect #\d+ free heap: \d+ B', '\[app\] tick #\d+ queued']
reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 120

[[step]]
say = "T5b/R1: the startup message `online` is retained again after the Wi-Fi blip (S3-B2)"
attended = true
probe = ["just", "mqtt-status", "{example}"]
arm = false
expect = '^online$'
serial_reject = '\[app\] tick #\d+ failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 10
