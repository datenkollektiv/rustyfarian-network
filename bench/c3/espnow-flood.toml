# ESP-NOW send-queue saturation and deadlines on both tiers
# ESP-IDF scout `idf_c3_espnow_scout` and hal peer `hal_c3_espnow_peer`, both with
# `ESPNOW_SCENARIO=flood`, against a running
# ESP-NOW coordinator (an IDF C3 `idf_c3_espnow_coordinator` or the hal C6 `hal_c6_espnow_sta_coordinator`).
# The hal peer reads the coordinator MAC from `ESPNOW_PEER_MAC`, so set both MAC variables;
# `just bench idf_c3_espnow_scout` or `just bench hal_c3_espnow_peer` runs one tier only.
# Both variables are read at build time; set them in the shell for the run, or the scout runs its default loop:
#   ESPNOW_SCENARIO=flood COORDINATOR_MAC=<mac> ESPNOW_PEER_MAC=<mac> just bench c3 espnow-flood --port <c3 port>
# The after-flood send is `Ok` or `NoAck` on the scout and `Ok` or `SendFailed` on the hal peer.
# The first step reads the boot, so only the later steps reject a reboot. No person needed.
examples = ["idf_c3_espnow_scout", "hal_c3_espnow_peer"]

[[step]]
say = "The first flood of 8 ends without a hang, followed by a good send"
expect = ['ESPNOW-GATE flood PASS: flood of 8: .*after-flood send (Ok|NoAck|SendFailed)']
reject = 'ESPNOW-GATE \S+ FAIL|PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 120
arm = false

[[step]]
say = "Two more floods pass, with no reboot in between"
expect = ['ESPNOW-GATE flood PASS: flood of 8: .*after-flood send (Ok|NoAck|SendFailed)', 'ESPNOW-GATE flood PASS: flood of 8: .*after-flood send (Ok|NoAck|SendFailed)']
reject = 'ESPNOW-GATE \S+ FAIL|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 30
arm = false
