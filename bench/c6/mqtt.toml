# MQTT smoke with a router block, ESP-IDF tier (runbook C6-I2).
# Needs `.env` (WIFI_*, MQTT_HOST as an IPv4) pointing at a running broker (`just doctor` checks it).
# Prints `[mqtt] connected — …`, `[mqtt] heartbeat N sent` and `[mqtt] disconnected — will reconnect automatically`.
examples = ["idf_c6_mqtt"]

[[step]]
say = "Check the signal of the joined AP (warns below -75 dBm)"
# The association line names the AP: `[wifi] link up #1 — bssid …, ch N, rssi -NN dBm` (hal)
# or `WiFi associated — …` (IDF). It passes unless that RSSI is below -75 dBm, a far mesh node.
expect = '(link up #1|WiFi associated)(?! .*rssi -(7[6-9]|[89]\d) dBm)'
reject = 'rssi -(7[6-9]|[89]\d) dBm'
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
optional = true
arm = false       # printed during the reset, before the step

[[step]]
say = "Wait for the broker session (unblock the device on the router first if a previous run left it blocked)"
expect = ['\[mqtt\] connected', '\[mqtt\] published retained status=online']
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
arm = false       # Wi-Fi and the first CONNACK arrive during the reset

[[step]]
say = "Wait for two heartbeats"
arm = false
expect = ['\[mqtt\] heartbeat \d+ sent', '\[mqtt\] heartbeat \d+ sent']
reject = 'heartbeat publish failed|PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('   # ESP-ROM / rst: is a reboot
timeout = 45

[[step]]
say = "On the broker, run `just mqtt-watch esp32c6-mqtt` (or the client_id from the `Config` boot line) and check status and heartbeat"
confirm = "Retained status 'online' and heartbeats arriving?"

[[step]]
say = "Once the device is online, please block it on the router, now (MAC as detected)"
arm = false
attended = true   # a person acts on the router
expect = 'WiFi disconnected'
reject = 'PANIC|panicked|Guru Meditation|abort\(\)'   # no ESP-ROM/rst: --attended skips the boot step, so this step reads the reset banner
timeout = 150

[[step]]
say = "Please unblock the device, now"
arm = false
attended = true
expect = ['\[mqtt\] connected', '\[mqtt\] heartbeat \d+ sent']
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 240
