# Wi-Fi connect with the on-board WS2812 (GPIO8) as the status light, both tiers (C6 matrix smoke).
# hal prints `Wi-Fi connected — IP: …` and holds dim green; idf prints `Connected — IP: …`, fades green, then turns the LED off.
examples = ["hal_c6_connect_async_led", "idf_c6_connect_nonblocking_rgb"]

[[step]]
say = "Check the signal of the joined AP (warns below -75 dBm)"
# The association line names the AP: `[wifi] link up #1 — bssid …, ch N, rssi -NN dBm` (hal)
# or `WiFi associated — …` (IDF). It passes unless that RSSI is below -75 dBm, a far mesh node.
expect = '(link up #1|WiFi associated)(?! .*rssi -(7[6-9]|[89]\d) dBm)'
reject = 'rssi -(7[6-9]|[89]\d) dBm'
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
optional = true
arm = false       # printed during the reset, before the step

[[step]]
say = "Wait for the DHCP lease (unblock the device on the router first if a previous run left it blocked)"
expect = '[Cc]onnected \W+ IP: '
timeout = 150   # a device still blocked from a previous run backs off up to 30 s
arm = false       # printed during the reset, before the step

[[step]]
say = "Look at the LED"
confirm = "Did it pulse blue while connecting, then turn green (idf: green, then off)?"

[[step]]
say = "Leave it running for 20 s"
arm = false
duration = 20
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('   # ESP-ROM / rst: is a reboot
