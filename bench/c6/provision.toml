# esp-hal provisioning record with extras survives a reboot on the C6 (scenario H1 of
# docs/runbooks/esp-hal-provisioning-extras-hardware-test.md).
# The store must be blank, or the board boots `Already provisioned` and opens no portal: erase first, pinned to
# the C6, because `erase-flash` takes the first matching port:
#   ESPFLASH_PORT=<c6 port> just --yes erase-flash
# Build with a fixed SoftAP name so the operator knows which network to join; a shell variable wins over `.env`:
#   PORTAL_SSID_OVERRIDE=bench-c6-portal just bench c6 provision --port <c6 port>
# `just portal-save` reads WIFI_SSID, MQTT_HOST and the optional MQTT_* and DEVICE_NAME (default hal-extras-test).
# A person joins the SoftAP from this machine, rejoins the normal Wi-Fi afterwards, and replugs the board.
# Uses `run` (rustyfarian-bench v0.5.0 or later). No step waits for Enter.
examples = ["hal_c6_provision_mqtt"]

[[step]]
say = "The blank store opens the portal (if it says `Already provisioned`, erase the C6 first)"
expect = 'Portal HTTP server listening on port 80'
reject = 'Already provisioned|PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 60
arm = false       # printed during the reset

[[step]]
say = "Join the Wi-Fi `bench-c6-portal` from THIS machine, not a phone (the submit with the extras runs here)"
attended = true   # a person changes this machine's Wi-Fi
arm = false
expect = 'Portal: phone joined AP'
reject = 'PANIC|panicked|Guru Meditation|abort\(\)|ESP-ROM:|rst:0x[0-9a-f]+ \('
timeout = 180

[[step]]
say = "Submit the form with two extras; the firmware commits and restarts into the provisioned boot"
attended = true   # needs the Wi-Fi join above
# The DHCP lease on the SoftAP lands a few seconds after the join, so the submit retries until the portal answers.
run = ["sh", "-c", "for i in 1 2 3 4 5 6 7 8; do just portal-save 192.168.4.1 2 && exit 0; sleep 3; done; exit 1"]
run_timeout = 60
arm = false
expect = ['Portal: submission accepted', 'Portal: credentials committed to flash', 'Already provisioned — .*extras=2']
reject = 'Portal: submission rejected|POST /save rejected|PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 60

[[step]]
say = "Unplug the board's USB cable and plug it back in (then rejoin this machine's normal Wi-Fi)"
attended = true   # a person power-cycles the board
# The provisioned boot prints once and then spins silently, and a USB-Serial-JTAG port drops what is printed before
# the reader reopens it; so this step watches the port path go and come back, and the next step resets.
probe = ["sh", "-c", "while [ -e '{port}' ]; do sleep 0.2; done; echo 'port gone'; while [ ! -e '{port}' ]; do sleep 0.2; done; echo 'port back'"]
arm = false
expect = ['port gone', 'port back']
timeout = 180

[[step]]
say = "After the power cut the store still holds the record"
reset = true      # captures the whole boot on the reopened port
# Device name and profile come from the form `just portal-save` submitted.
expect = 'Already provisioned — .*device_name=\S+, profile=WifiMqttDevice, extras=2'
reject = 'Portal HTTP server listening|is_provisioned error|re-provisioning|PANIC|panicked|Guru Meditation|abort\(\)'
timeout = 30
arm = false
