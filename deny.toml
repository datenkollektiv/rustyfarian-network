[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # atomic-polyfill is unmaintained (RUSTSEC-2023-0089) but there is no safe
    # upgrade path.  Exact chain (confirmed via `cargo deny check` output):
    #   rustyfarian-esp-idf-network (lora feature) → lorawan-device 0.12.2 → heapless 0.7.17 → atomic-polyfill 1.0.3
    # Note: the workspace declares heapless 0.8; lorawan-device 0.12 has its own
    # separate transitive dep on heapless 0.7, which is why both versions coexist.
    # Resolves when lorawan-device upgrades to heapless 0.8 (not yet in 0.12).
    "RUSTSEC-2023-0089",
    # paste (RUSTSEC-2024-0436) and unsafe-libyaml (RUSTSEC-2024-0449) are unmaintained;
    # both reach the graph only through the per-target-triple dev-dependency on
    # esp-backtrace 0.20.0 that the hal examples use (ADR 021).  Exact chains:
    #   rustyfarian-esp-hal-network (dev) → esp-backtrace 0.20.0 → riscv 0.15.0 → paste 1.0.15
    #   rustyfarian-esp-hal-network (dev) → esp-backtrace 0.20.0 → esp-config 0.8.0 → serde_yaml 0.9.34 → unsafe-libyaml 0.2.11
    # Dev-only: the published library does not depend on esp-backtrace.  No safe
    # upgrade exists until esp-backtrace moves off riscv 0.15 / esp-config 0.8.
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0449",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/datenkollektiv/rustyfarian-ws2812"]
