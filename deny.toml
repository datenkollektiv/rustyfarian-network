[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # atomic-polyfill is unmaintained (RUSTSEC-2023-0089) but there is no safe
    # upgrade path.  Exact chain (confirmed via `cargo deny check` output):
    #   rustyfarian-esp-idf-network (lora feature) → lorawan-device 0.12.2 → heapless 0.7.17 → atomic-polyfill 1.0.3
    # Note: the workspace declares heapless 0.8; lorawan-device 0.12 has its own
    # separate transitive dep on heapless 0.7, which is why both versions coexist.
    # Resolves when lorawan-device upgrades to heapless 0.8 (not yet in 0.12).
    "RUSTSEC-2023-0089",
    # anyhow 1.0.102 unsoundness in `Error::downcast_mut()` (RUSTSEC-2026-0190).
    # Host-toolchain build dep only (not reachable in shipped firmware):
    #   embuild → manyhow 0.11.4 → anyhow 1.0.102
    # A patch fix exists (anyhow >= 1.0.103); deferred to a dependency-hygiene
    # pass to keep this PR scoped. Remove after `cargo update -p anyhow`.
    "RUSTSEC-2026-0190",
    # crossbeam-epoch 0.9.18 invalid pointer deref in `fmt::Pointer` for
    # `Atomic`/`Shared` (RUSTSEC-2026-0204). Host-toolchain build dep only:
    #   embuild → globwalk → ignore → crossbeam-deque → crossbeam-epoch 0.9.18
    # A patch fix exists (crossbeam-epoch >= 0.9.20); deferred to a
    # dependency-hygiene pass. Remove after `cargo update -p crossbeam-epoch`.
    "RUSTSEC-2026-0204",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/datenkollektiv/rustyfarian-ws2812"]
