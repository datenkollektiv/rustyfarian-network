[package]
name        = "rustyfarian-esp-hal-network"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Required by esp-hal 1.2 / esp-rtos 0.4 / esp-radio 1.0.0-beta.1 (all declare 1.95.0).
# The `esp` toolchain reports `1.95.0-nightly`, which Cargo accepts for "1.95".
rust-version = "1.95"
description = "Bare-metal (esp-hal) async drivers for Wi-Fi, LoRa, OTA, and provisioning on ESP32-C3, ESP32-C6, ESP32-S3, and ESP32"
keywords    = ["esp32", "esp-hal", "embedded", "no-std", "async"]
categories  = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
# The LWT and ESP-NOW coordinator examples share their application bodies with the ESP-IDF
# twins (`examples-shared/lwt_app.rs`, `examples-shared/espnow_echo_app.rs`), which live
# outside this package; they are bench-only.
exclude = ["examples/hal_esp32s3_mqtt_lwt.rs", "examples/hal_esp32_mqtt_lwt.rs", "examples/hal_c3_mqtt_lwt.rs", "examples/hal_c6_espnow_sta_coordinator.rs"]

[package.metadata.docs.rs]
default-target = "riscv32imc-unknown-none-elf"
features = ["wifi", "esp32c3", "rt", "embassy"]
# docs.rs for bare-metal crates requires a no_std target and selection of exactly
# one chip feature. We document the ESP32-C3 (RISC-V, broadest support) with the
# mandatory `rt` and `embassy` features needed for async Wi-Fi examples.

[features]
default = []

# ── Domain features ──────────────────────────────────────────────────────────

# wifi: async STA + SoftAP via esp-radio 1.0.0-beta.1 (pre-release, exact-pinned).
# The compile_error! guard remains in wifi/mod.rs: enabling any chip feature
# without `embassy` triggers a compile error in the wifi module.
# `embassy` is implied by `wifi` (esp-radio is async-only since 0.18).
wifi = [
    "juggler/wifi",
    "dep:esp-hal",
    "dep:esp-radio", "esp-radio?/wifi", "esp-radio?/esp-alloc", "esp-radio?/unstable", "esp-radio?/log-04",
    "dep:esp-rtos", "esp-rtos?/esp-radio", "esp-rtos?/esp-alloc",
    "dep:esp-alloc",
    "dep:esp-bootloader-esp-idf",
    "embassy",
]

# mqtt: async MQTT 5 client over the `wifi` embassy-net stack (ADR 019).
# Implies `wifi` (the runner needs the STA stack) and so `embassy`.
mqtt = [
    "wifi",
    "juggler/mqtt",
    "dep:minimq",
    "dep:embassy-futures",
    "embassy",
    # Broker host names are resolved with `Stack::dns_query`; `dns` is gated independently.
    "embassy-net?/dns",
]

# espnow: ESP-NOW over esp-radio `esp_now` (ADR 020). Implies `wifi` (the radio, `esp_rtos`,
# the heap and embassy-time come with it) and enables the `espnow` domain of juggler.
# Supported on `esp32c3` and `esp32c6`. `esp-radio/coex` stays off (BLE/802.15.4 only).
espnow = [
    "wifi",
    "juggler/espnow",
    "esp-radio?/esp-now",
    "embassy",
]

# lora: synchronous LoRa stub using embedded-hal SPI + GPIO.
# No embassy requirement; lora is nb-based and blocking.
lora = [
    "juggler/lora",
    "dep:esp-hal",
    "dep:esp-bootloader-esp-idf",
    "dep:embedded-hal-bus",
]

# ota: async bare-metal OTA manager (esp32, esp32c3, esp32c6, esp32s3).
ota = [
    "juggler/ota",
    "dep:esp-hal",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-storage",
    "embassy",
]

# ota-wire: opt-in OTA wire contract (command/manifest/status JSON). Pulls serde, serde_json and `alloc`;
# the consumer must provide a global allocator (`wifi` brings `esp-alloc`).
ota-wire = ["ota", "juggler/ota-wire"]

# provisioning: SoftAP captive-portal (always requires wifi + embassy).
# `esp-storage` is required for the flash credential store on RISC-V targets.
provisioning = [
    "wifi",
    "juggler/provisioning",
    "juggler/flash-store",
    "dep:esp-storage",
    "embassy",
]
# `wifi` is included because provisioning/session.rs imports crate::wifi::SoftApHandle.
# `embassy` is transitively implied via `wifi` but listed here for explicitness.

# Belt-and-braces compile-time guard: provisioning without wifi must fail.
# (provisioning already enables wifi above; this catches any future mis-wiring.)

# ── Cross-cutting support feature ────────────────────────────────────────────

# embassy: async executor + network stack + time.
# Enabled automatically by `wifi`, `ota`, and `provisioning`.
embassy = [
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-net",
    "embassy-net?/dhcpv4",
    "embassy-net?/proto-ipv4",
    "embassy-net?/udp",
    "embassy-net?/tcp",
    "embassy-net?/medium-ethernet",
    "dep:embassy-time",
    "dep:embedded-io-async",
    "dep:static_cell",
    "esp-rtos?/embassy",
]

# ── Cross-cutting optional features ──────────────────────────────────────────

unstable = ["esp-hal?/unstable"]
rt = ["esp-hal?/rt"]

# ── Optional LED dependency for the hal_c6_connect_async_led example ─────────
ws2812 = [
    "dep:rustyfarian-esp-hal-ws2812",
]

# ── Chip features ─────────────────────────────────────────────────────────────
#
# Each chip feature selects the chip on all optional deps that are present.
# The `dep?/feature` syntax is a no-op when the optional dep is not yet activated
# by any domain feature — no-op when dep absent.
#
# The crate depends on neither `esp-println` nor `esp-backtrace`: the firmware adds both
# and selects exactly one console and the panic handler itself, like the `critical-section`
# provider (ADR 021). The examples get them from the per-target dev-dependencies below.

# ESP32-C3: RISC-V, riscv32imc-unknown-none-elf
# Supports: wifi, lora, ota, provisioning, espnow
esp32c3 = [
    "esp-hal?/esp32c3",
    "esp-radio?/esp32c3",
    "esp-rtos?/esp32c3",
    "esp-alloc?/esp32c3",
    "esp-bootloader-esp-idf?/esp32c3",
    "esp-storage?/esp32c3",
    "rustyfarian-esp-hal-ws2812?/esp32c3",
]

# ESP32-C6: RISC-V, riscv32imac-unknown-none-elf
# Supports: wifi, lora, ota, provisioning, espnow
esp32c6 = [
    "esp-hal?/esp32c6",
    "esp-radio?/esp32c6",
    "esp-rtos?/esp32c6",
    "esp-alloc?/esp32c6",
    "esp-bootloader-esp-idf?/esp32c6",
    "esp-storage?/esp32c6",
    "rustyfarian-esp-hal-ws2812?/esp32c6",
]

# ESP32: Xtensa LX6, xtensa-esp32-none-elf
# Supports: wifi, mqtt, lora, ota. Provisioning and ESP-NOW are not wired for it.
esp32 = [
    "esp-hal?/esp32",
    "esp-radio?/esp32",
    "esp-rtos?/esp32",
    "esp-alloc?/esp32",
    "esp-bootloader-esp-idf?/esp32",
    "esp-storage?/esp32",
]

# ESP32-S3: Xtensa LX7, xtensa-esp32s3-none-elf
# Supports: wifi, lora, ota, provisioning
esp32s3 = [
    "esp-hal?/esp32s3",
    "esp-radio?/esp32s3",
    "esp-rtos?/esp32s3",
    "esp-alloc?/esp32s3",
    "esp-bootloader-esp-idf?/esp32s3",
    "esp-storage?/esp32s3",
]

[dependencies]
# ── Always-on ────────────────────────────────────────────────────────────────
juggler          = { workspace = true, default-features = false }
log              = { workspace = true }
embedded-hal     = { workspace = true }
pennant          = { workspace = true }
rgb              = { workspace = true }
# TODO post-1.0: gate embassy-sync and heapless on the `provisioning` feature.
# Currently always-on because session.rs references these types unconditionally
# (SharedState fields) and the host tests in session.rs must compile with
# --no-default-features.
embassy-sync     = { workspace = true }
heapless         = { workspace = true }
# `embedded_storage` and `nb` are always-on so the provisioning/session.rs and
# lora/driver.rs source files (and their embedded unit tests) can compile with
# --no-default-features on the host toolchain without the chip-specific optional
# deps (esp-hal, esp-radio, etc.) being activated.  Both crates are pure Rust
# and compile on any target.
embedded-storage = { workspace = true }
nb               = { workspace = true }
# `critical-section` is always-on: the ESP-NOW take-out cells and singleton guard are host-tested.
# The implementation comes from esp-hal on target and from `mod host_critical_section` in
# `src/lib.rs` (lib unit-test binary only) on the host.
critical-section = { workspace = true }

# ── Optional — activated by domain or chip features ──────────────────────────
esp-hal                 = { workspace = true, features = ["unstable"], optional = true }
esp-radio               = { workspace = true, optional = true }
esp-rtos                = { workspace = true, optional = true }
esp-alloc               = { workspace = true, optional = true }
# `embedded-storage`: the `NorFlash` view of a partition (`as_nor_flash`), which
# writes without the read-modify-erase cycle (bug 004).
esp-bootloader-esp-idf  = { workspace = true, optional = true, features = ["embedded-storage"] }
# `embedded-storage`: the `NorFlash` impls the provisioning store needs are opt-in since esp-storage 0.10.
esp-storage             = { workspace = true, optional = true, features = ["critical-section", "embedded-storage"] }

embedded-hal-bus        = { workspace = true, optional = true }

embassy-executor        = { workspace = true, optional = true }
embassy-futures         = { workspace = true, optional = true }
embassy-net             = { workspace = true, optional = true }
embassy-time            = { workspace = true, optional = true }
embedded-io-async       = { version = "0.7", optional = true }
static_cell             = { workspace = true, optional = true }

rustyfarian-esp-hal-ws2812 = { workspace = true, optional = true }

minimq                  = { workspace = true, optional = true }

# Host tests get their critical-section implementation from `host_critical_section` in lib.rs,
# not from `critical-section/std`: that feature selects `restore-state-bool`, which cannot
# coexist with the `restore-state-none` that `esp-idf-hal/critical-section` (a dev-dependency
# of the IDF crate) selects when the whole workspace is linted in one cargo invocation.
[dev-dependencies]
embassy-executor = { workspace = true }
embassy-time     = { workspace = true }
embedded-io-async = "0.7"
# `hal_c3_espnow_peer` gate scenarios join several `send_acked` futures.
embassy-futures  = { workspace = true }
# Activate juggler sub-features needed by the host-side unit tests embedded in
# the ota, provisioning, session, and lora module files.  These are unified with the
# [dependencies] entry so that `cfg(test)` compilation with --no-default-features
# can reach juggler::ota, juggler::provisioning, juggler::wifi, juggler::mqtt, and
# juggler::lora without pulling in any chip-specific hardware crate.
juggler = { workspace = true, default-features = false, features = ["ota", "ota-wire", "provisioning", "flash-store", "wifi", "mqtt", "lora", "espnow"] }

# The examples are the firmware: they carry `esp-println` (console) and `esp-backtrace`
# (panic handler) themselves. The target triple is the only place that can carry the chip
# feature now that the library forwards none; the host test build never sees these crates.

# Host-only mock clock so the portal phase-budget tests can expire a `with_timeout`; the
# bare-metal targets get their time driver from esp-rtos.
# `espidf` is excluded: workspace clippy builds this crate for it next to `esp-idf-svc`, whose own
# `embassy-time-driver` would unify with the mock driver.
[target.'cfg(not(any(target_os = "none", target_os = "espidf")))'.dev-dependencies]
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-16"] }

# ESP32-C3
[target.riscv32imc-unknown-none-elf.dev-dependencies]
esp-println   = { workspace = true, features = ["esp32c3", "auto", "log-04"] }
esp-backtrace = { workspace = true, features = ["esp32c3"] }

# ESP32-C6
[target.riscv32imac-unknown-none-elf.dev-dependencies]
esp-println   = { workspace = true, features = ["esp32c6", "auto", "log-04"] }
esp-backtrace = { workspace = true, features = ["esp32c6"] }

# ESP32-S3
[target.xtensa-esp32s3-none-elf.dev-dependencies]
esp-println   = { workspace = true, features = ["esp32s3", "auto", "log-04"] }
esp-backtrace = { workspace = true, features = ["esp32s3"] }

# ESP32 (classic)
[target.xtensa-esp32-none-elf.dev-dependencies]
esp-println   = { workspace = true, features = ["esp32", "auto", "log-04"] }
esp-backtrace = { workspace = true, features = ["esp32"] }

