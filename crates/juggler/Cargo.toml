[package]
name = "juggler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-agnostic types, validation, and state machines for Wi-Fi, MQTT, LoRa, ESP-NOW, OTA, and provisioning on ESP32"
keywords = ["esp32", "wifi", "mqtt", "lora", "embedded"]
categories = ["embedded", "no-std"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []

# Domain features — each gates exactly one src/ subdirectory
wifi = []
mqtt = []
# `sx126x` + `embedded-hal`: the shared SX1262 bring-up (`lora::sx1262`, ADR 023 rung 1).
lora = ["dep:heapless", "dep:nb", "dep:lorawan-device", "dep:sx126x", "dep:embedded-hal"]
espnow = []
ota = ["dep:heapless", "dep:sha2"]
# OTA wire contract (command, manifest, status JSON, reason codes). Needs alloc; the base `ota` feature stays alloc-free.
ota-wire = ["ota", "dep:serde", "dep:serde_json"]
# `lora` is not implied: a Wi-Fi + MQTT device must not pull lorawan-device.
# Enable `lora` alongside for `LoraFields::to_lora_config`.
provisioning = ["wifi", "mqtt", "dep:heapless", "dep:zeroize"]
# The NorFlash provisioning store (`provisioning::flash_store`): TLV records with
# CRC and two-sector arbitration over `embedded-storage`. no_std, no alloc.
flash-store = ["provisioning", "dep:embedded-storage"]

# Mock feature — test doubles for radio and ESP-NOW drivers
# A single shared mock feature is used because only two domains have mocks with
# non-trivial test dependencies: wifi and lora. MockEspNowDriver requires alloc
# (uses std::collections::VecDeque); host-test environments always have alloc.
mock = ["wifi", "lora", "espnow"]

# std feature — enables the std-only helpers: in mqtt, the connect/subscriber
# threads, CallbackScope, ConnectionEpoch, SubscribeClient (std::thread,
# std::sync, anyhow::Result); with provisioning, provisioning::SessionState
# (std::sync::Condvar). It implies mqtt, which provisioning enables anyway, so
# a provisioning build only adds anyhow.
# The merged crate is no_std by default; std is opt-in for platform crates.
std = ["mqtt", "dep:anyhow"]

[dependencies]
# Always-present: used by backoff, status_colors (zero-dep, always-on modules)
# and by domain modules that reference log macros.
log = { workspace = true }

# Domain-optional deps (dep: prefix prevents feature auto-naming)
heapless = { workspace = true, optional = true }
nb = { workspace = true, optional = true }
lorawan-device = { workspace = true, optional = true }
sx126x = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
embedded-storage = { workspace = true, optional = true }

[dev-dependencies]
# The RNG the real `lorawan_device` `Device` needs in the LoRa PHY bridge tests.
rand_core = { workspace = true }
