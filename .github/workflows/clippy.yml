name: Clippy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup ESP-RS toolchain (RISC-V)
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The key covers the file that selects the ESP-IDF build: a restored esp-idf-sys
      # CMake tree from another ESP_IDF_VERSION fails to configure.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: idf-${{ hashFiles('.cargo/config.toml') }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run clippy
        run: just clippy
