name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    # Pinned to 24.04: `ubuntu-latest` moved to 26.04 (libxml2 2.14, soname libxml2.so.16),
    # where ESP-IDF v5.3.3's prebuilt esp-clang 16 fails to load libxml2.so.2 during
    # `idf_tools.py install`, so every esp-idf-sys build dies (CI breakage 2026-10-30).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup ESP-RS toolchain (RISC-V)
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup cargo config
        run: cp .cargo/config.toml.dist .cargo/config.toml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny (licenses, advisories, bans)
        run: just deny

      - name: Check workspace
        run: just check

      - name: Test (all platform-independent unit tests)
        run: just test

  check-sta-only:
    # Pinned to 24.04: `ubuntu-latest` moved to 26.04 (libxml2 2.14, soname libxml2.so.16),
    # where ESP-IDF v5.3.3's prebuilt esp-clang 16 fails to load libxml2.so.2 during
    # `idf_tools.py install`, so every esp-idf-sys build dies (CI breakage 2026-10-30).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup ESP-RS toolchain (RISC-V)
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup cargo config
        run: cp .cargo/config.toml.dist .cargo/config.toml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Check STA-only (wifi feature with SoftAP disabled)
        run: just check-sta-only

  build-examples:
    # Pinned to 24.04: `ubuntu-latest` moved to 26.04 (libxml2 2.14, soname libxml2.so.16),
    # where ESP-IDF v5.3.3's prebuilt esp-clang 16 fails to load libxml2.so.2 during
    # `idf_tools.py install`, so every esp-idf-sys build dies (CI breakage 2026-10-30).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup ESP-RS toolchain (RISC-V + Xtensa)
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          # ldproxy IS required here: this job links an ESP-IDF binary
          # (`just build-example idf_c3_connect`), and `.cargo/config.toml`
          # sets `linker = "ldproxy"` for the *-espidf targets. The
          # `ldproxy: false` guidance in CLAUDE.md applies only to the format
          # job, which runs `cargo fmt` and never links.
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup cargo config
        run: cp .cargo/config.toml.dist .cargo/config.toml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Build IDF example (idf_c3_connect)
        run: just build-example idf_c3_connect

      - name: Build bare-metal example (hal_c3_connect_async)
        run: just build-example hal_c3_connect_async

      # `just verify` lints only the workspace default target, so the bare-metal
      # crate is otherwise never linted on riscv32imc/riscv32imac. Run it here
      # rather than in `verify` to keep local pre-commit runs fast.
      - name: Clippy the bare-metal crate on its own targets
        run: just clippy-hal
