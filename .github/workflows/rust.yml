name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: datenkollektiv/rustyfarian-ci/.github/workflows/host-checks.yml@v1
    with:
      check: test

  deny:
    uses: datenkollektiv/rustyfarian-ci/.github/workflows/host-checks.yml@v1
    with:
      check: deny

  # Workspace check on the ESP-IDF default target, plus the pure OTA checks (ESP toolchain: -Zbuild-std and riscv32imc).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      XTENSA_VERSION: "1.97.0.0"
      # Must match ESP_IDF_VERSION in .cargo/config.toml: setup-esp-idf exports it, which wins over cargo's [env].
      IDF_VERSION: v6.1
    steps:
      - uses: actions/checkout@v5

      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          # RISC-V-only job: the esp toolchain is installed only when an Xtensa target is listed.
          buildtargets: esp32

      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-esp-idf@v1
        with:
          idf-version: ${{ env.IDF_VERSION }}
          mcu: esp32c6

      - uses: Swatinem/rust-cache@v2
        with:
          # A restored esp-idf-sys CMake tree from another IDF version or sdkconfig fails to configure.
          key: check-${{ env.XTENSA_VERSION }}-${{ env.IDF_VERSION }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig*.defaults') }}

      - uses: extractions/setup-just@v4

      - run: just ci-check

  # Wi-Fi with SoftAP disabled (STA-only consumers): reconfigures esp-idf-sys with the sta-only sdkconfig overlay.
  check-sta-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      XTENSA_VERSION: "1.97.0.0"
      IDF_VERSION: v6.1
    steps:
      - uses: actions/checkout@v5

      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          buildtargets: esp32

      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-esp-idf@v1
        with:
          idf-version: ${{ env.IDF_VERSION }}
          mcu: esp32c6

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-sta-only-${{ env.XTENSA_VERSION }}-${{ env.IDF_VERSION }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig*.defaults') }}

      - uses: extractions/setup-just@v4

      - run: just ci-check-sta-only

  # Smoke build of one ESP-IDF example and one bare-metal example (RISC-V, both link).
  build-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      XTENSA_VERSION: "1.97.0.0"
      IDF_VERSION: v6.1
    steps:
      - uses: actions/checkout@v5

      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          buildtargets: esp32

      # build-example.sh sets MCU per example; this value is only the default for the job.
      - uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-esp-idf@v1
        with:
          idf-version: ${{ env.IDF_VERSION }}
          mcu: esp32c3

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-examples-${{ env.XTENSA_VERSION }}-${{ env.IDF_VERSION }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig*.defaults') }}

      - uses: extractions/setup-just@v4

      - run: just ci-build-examples
